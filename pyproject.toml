[project]
name = "pki-kit"
version = "0.0.2"
description = "Unified Python toolkit for X.509 and Nebula PKI — issue, revoke, and export certificates for mTLS and overlay networks"
readme = "README.md"
authors = [{ name = "Dmitry Tatarkin", email = "tatarkin@gmail.com" }]
requires-python = ">=3.12"
keywords = [
  "pki",
  "x509",
  "certificates",
  "tls",
  "mtls",
  "nebula",
  "certificate-authority",
  "cryptography",
  "security",
  "infrastructure",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "Topic :: Security :: Cryptography",
  "Topic :: System :: Networking",
  "Typing :: Typed",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: OS Independent",
]
dependencies = [
  "cryptography>=43.0",
  "pydantic>=2.0",
  "python-ulid>=3.0",
  "ruamel-yaml>=0.18",
]

[project.optional-dependencies]
cli = ["typer>=0.15", "rich>=13.0"]

[project.urls]
Homepage = "https://github.com/dtatarkin/pki-kit"
Repository = "https://github.com/dtatarkin/pki-kit"
Issues = "https://github.com/dtatarkin/pki-kit/issues"

[project.scripts]
pki-kit = "pki.cli:main"
[dependency-groups]
dev = [
  "mypy",
  # The type checkers read the command-line package, which imports the
  # optional dependencies of the `cli` extra.
  "pki-kit[cli]",
  "pre-commit",
  "pytest",
  "python-dotenv",
  "ruff",
  # Pins the `just` the justfile formatter hook runs.
  "rust-just",
  "ty",
]

[tool.uv.build-backend]
module-name = "pki"

[build-system]
requires = ["uv_build"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py312"
line-length = 120
src = ["src"]

[tool.ruff.lint]
select = [
  "F",
  "E",
  "W",
  "I",
  "N",
  "UP",
  "B",
  "A",
  "C4",
  "DTZ",
  "T20",
  "SIM",
  "TCH",
  "RUF",
  "PT",
  "S",
  "ANN",
]
# Calling a tool by name, resolved on PATH, is how this library reaches the
# binaries it drives; these two rules fire on every such call.
ignore = ["S603", "S607"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ANN", "S101"]
"src/pki/cli/**/*.py" = ["T20", "TCH"]

[tool.ruff.lint.isort]
known-first-party = ["pki"]

[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = ["pydantic.BaseModel"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = "pki.cli.*"
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = "ruamel.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ty.rules]
unused-type-ignore-comment = "ignore"
